plugins {
    id 'java'
    id 'application'
    id 'com.google.protobuf' version '0.9.4'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

configurations.all {
    if (file("../FF4StatsLib").exists()) {
        resolutionStrategy.dependencySubstitution {
            substitute(module("com.github.sg4e:FF4StatsLib:master-SNAPSHOT")).using(project(":FF4StatsLib"))
        }
    }
}

dependencies {
    implementation 'com.glazedlists:glazedlists:1.11.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.25.2'
    implementation 'org.apache.logging.log4j:log4j-api:2.25.2'
    annotationProcessor 'org.apache.logging.log4j:log4j-core:2.25.2'
    implementation 'org.slf4j:slf4j-log4j12:1.7.36'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
    implementation 'com.google.guava:guava:33.6.0-jre'

    implementation 'io.grpc:grpc-netty-shaded:1.65.1'
    implementation 'io.grpc:grpc-protobuf:1.65.1'
    implementation 'io.grpc:grpc-stub:1.65.1'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'com.github.sg4e:FF4StatsLib:master-SNAPSHOT'

    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:unchecked'
    options.compilerArgs << '-Xlint:deprecation'
}

application {
    mainClass = 'sg4e.maikatracker.MaikaTracker'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}


def grpcVersion = '1.65.1'
def protobufVersion = '3.25.3'

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}
