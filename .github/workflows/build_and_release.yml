name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out MaikaTracker
        uses: actions/checkout@v4
        with:
          path: MaikaTracker

      - name: Check out FF4StatsLib
        uses: actions/checkout@v4
        with:
          repository: sg4e/FF4StatsLib
          path: FF4StatsLib

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test
        working-directory: MaikaTracker

  release:
    name: Build and create GitHub release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: write

    steps:
      - name: Check out MaikaTracker
        uses: actions/checkout@v4
        with:
          path: MaikaTracker

      - name: Check out FF4StatsLib
        uses: actions/checkout@v4
        with:
          repository: sg4e/FF4StatsLib
          path: FF4StatsLib

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR
        run: ./gradlew build
        working-directory: MaikaTracker

      - name: Create release metadata
        id: release
        run: |
          tag="$(date +'%Y%m%d%H%M%S')-${GITHUB_SHA::7}"
          name="MaikaTracker $(date +'%d.%m.%Y %H:%M')"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: MaikaTracker/build/libs/MaikaTracker.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
